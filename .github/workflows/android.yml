name: Android

on:
  push:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias (lógica compartida)
        run: ./gradlew :core:testDebugUnitTest
      - name: APK de depuración — Cliente (comparte ubicación)
        run: ./gradlew :client:assembleDebug
      - name: APK de depuración — Manager (panel)
        run: ./gradlew :manager:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: octopus-track-client-debug-apk
          path: apps/android/client/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: octopus-manager-debug-apk
          path: apps/android/manager/build/outputs/apk/debug/*.apk
