# Entorno local: PostgreSQL 17 + TimescaleDB + PostGIS, y Redis para Pub/Sub.
services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus
      POSTGRES_DB: octopus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
