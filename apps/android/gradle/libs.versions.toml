[versions]
agp = "8.13.2"
kotlin = "2.2.21"
composeBom = "2025.11.01"
coreKtx = "1.17.0"
splash = "1.0.1"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
navigation = "2.9.6"
